failures:

  - id: F001
    name: "Notion teal colour rejected"
    symptom: "Notion API 400: body.properties.Status.select.options[6].color should be 'default', 'gray', 'brown', 'orange'..."
    cause: "'teal' is not a valid Notion select colour"
    fix: "Replace 'teal' with valid colour (green, brown, etc.) in create_notion_database.js"
    date_found: 2026-03-26
    status: fixed

  - id: F002
    name: "Boolean checkbox receives empty string"
    symptom: "Notion API 400: body.properties.Title rewritten by Google.checkbox should be a boolean, instead was ''"
    cause: "JS expression `serpTitle && serpTitle !== title` returns '' (falsy string) not false when serpTitle is empty"
    fix: "Wrap in `!!()` to cast to boolean: `!!(serpTitle && serpTitle !== title)`"
    date_found: 2026-03-26
    status: fixed

  - id: F003
    name: "Sitemap index not followed"
    symptom: "weekly_link_scan.js finds 0 URLs from sitemap"
    cause: "WordPress serves a sitemap index (<sitemapindex>) pointing to child sitemaps, not direct page URLs"
    fix: "Detect <sitemapindex>, fetch each child sitemap, collect all <loc> URLs"
    date_found: 2026-03-26
    status: fixed

  - id: F004
    name: "--env-file not supported on Node 18"
    symptom: "node: bad option: --env-file=.env"
    cause: "--env-file flag requires Node 20+, VPS runs Node 18"
    fix: "Use start.js wrapper that imports dotenv/config before scheduler.js"
    date_found: 2026-03-26
    status: fixed

  - id: F005
    name: "PM2 cluster mode fails with ESM"
    symptom: "PM2 process shows 'waiting' with restarts, no logs"
    cause: "ESM modules don't work with PM2 cluster mode"
    fix: "Set exec_mode: 'fork' in ecosystem.config.cjs, use start.js wrapper"
    date_found: 2026-03-26
    status: fixed

  - id: F006
    name: "Google Sheets tab names have emoji prefixes"
    symptom: "Unable to parse range: Results Log!A1:N3"
    cause: "Sheet tabs are named with emoji prefixes (e.g. '📋 Results Log')"
    fix: "Wrap tab names in single quotes with emoji: \"'📋 Results Log'!A:N\""
    date_found: 2026-03-26
    status: fixed

  - id: F007
    name: "SSH from VPS to itself fails"
    symptom: "geo_lab_log_check.js can't read logs when running on VPS"
    cause: "Script uses SSH to read logs, but when running locally on VPS, SSH to localhost is refused"
    fix: "Detect if log file exists locally (existsSync), read directly instead of SSH"
    date_found: 2026-03-28
    status: fixed

  - id: F008
    name: "Daily log rotation gaps"
    symptom: "geo_lab_log_check.js misses log data from previous day"
    cause: "Nginx logrotate runs daily, access.log.1 contains yesterday's data"
    fix: "Read both access.log and access.log.1 (delaycompress keeps .1 uncompressed)"
    date_found: 2026-03-28
    status: fixed

  - id: F009
    name: "WordPress post with future date shows as 'future' not 'publish'"
    symptom: "Post created with status=publish but shows future status, returns ?p=ID instead of slug URL"
    cause: "post_date set to tomorrow's date, WP auto-converts to 'future' status"
    fix: "Set date to current or past timestamp when publishing immediately"
    date_found: 2026-03-27
    status: fixed

  - id: F010
    name: "Multiple body tags in WordPress post content"
    symptom: "Screaming Frog reports HTML validation error on /extractability/"
    cause: "v3 HTML file pasted with <body> tag still present — WP theme adds its own"
    fix: "Strip DOCTYPE/html/head/body from content before WP deployment"
    date_found: 2026-03-27
    status: fixed

  - id: F011
    name: "Exact match Nginx location ignores trailing slash"
    symptom: "301 redirect works for /slug but not /slug/"
    cause: "location = /slug only matches exact path, not /slug/"
    fix: "Use regex location: location ~ ^/slug/?$ { return 301 /target/; }"
    date_found: 2026-03-27
    status: fixed

  - id: F012
    name: "v3 CSS stripped during WP content prep"
    symptom: "TL;DR, tables, stat cards render unstyled"
    cause: "Style block was inside <head> which got removed during DOCTYPE/head/body stripping"
    fix: "Extract <style> block separately, re-insert after JSON-LD in the wp:html wrapper"
    date_found: 2026-03-27
    status: fixed

  - id: F013
    name: "SVG chart Y-axis inverted"
    symptom: "Higher percentage value appears lower on the chart"
    cause: "SVG coordinate system: higher cy = lower on screen. March 6.7% had higher cy than Feb 3%"
    fix: "Swap cy values so higher percentage gets lower cy (higher position on chart)"
    date_found: 2026-03-27
    status: fixed

